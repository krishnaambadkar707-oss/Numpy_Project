services:
  - type: web
    name: numpy-audio-processor
    runtime: docker
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: ENV
        value: production
      - key: WHISPER_MODEL
        value: tiny
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: KMP_DUPLICATE_LIB_OK
        value: TRUE
