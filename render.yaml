services:
  - type: web
    name: numpy-audio-processor
    runtime: docker
    envVars:
      - key: PORT
        value: 10000
      - key: ENV
        value: production
      - key: WHISPER_MODEL
        value: base
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE_TYPE
        value: int8
